<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>3 Irmãs | Cadastro de Fornecedores</title>
    <link rel="stylesheet" href="CSS/painel.css">
    <link rel="stylesheet" href="CSS/navegacao.css">
</head>

<body>
    <div class="pagina">

        <header>
            <h1>Supermercado 3 Irmãs</h1>
            <p>Cadastro de Fornecedores</p>
        </header>

        <main>
            <form class="form-fornecedor">

                <h2>Novo Fornecedor</h2>

                <label for="empresa">Nome da empresa</label>
                <input type="text" id="empresa"
                    placeholder="Digite o nome do fornecedor" required>

                <label for="cnpj">CNPJ</label>
                <input type="text" id="cnpj"
                    placeholder="00.000.000/0000-00" required>

                <label for="responsavel">Nome do responsável</label>
                <input type="text" id="responsavel"
                    placeholder="Nome do representante" required>

                <label for="telefone">WhatsApp</label>
                <input type="tel" id="telefone"
                    placeholder="(00) 00000-0000" required>

                <label for="email">E-mail</label>
                <input type="email" id="email"
                    placeholder="exemplo@fornecedor.com" required>

                <label for="categoria">Categoria de produtos</label>
                <select id="categoria" required>
                    <option value="">Selecione uma categoria</option>
                    <option value="alimentos">Alimentos</option>
                    <option value="bebidas">Bebidas</option>
                    <option value="limpeza">Limpeza</option>
                    <option value="higiene">Higiene pessoal</option>
                    <option value="outros">Outros</option>
                </select>

                <a href="cadastro-produtos.html"
                    class="botao-continuar">
                    Cadastrar e Continuar
               </a>

            </form>

            <a href="index.html" class="voltar">
             &larr; Voltar ao Login
        </a>
        
        </main>

    </div>
</body>
</html>
